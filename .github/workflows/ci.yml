name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Report binary size
        shell: bash
        run: ls -l src-tauri/target/release/draw-on-screen* | grep -v '\.d$'

  launchers:
    name: Launcher smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, start and uninstall with the Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        # Piped input answers the "pause" shown on failure, so a failure cannot hang the job.
        run: |
          echo.| call run-windows.bat
          if errorlevel 1 exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\Draw on Screen\draw-on-screen.exe" exit /b 1
          if not exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Draw on Screen.lnk" exit /b 1
          type "%LOCALAPPDATA%\Programs\Draw on Screen\version.txt"
          echo.| call run-windows.bat --uninstall
          if exist "%LOCALAPPDATA%\Programs\Draw on Screen" exit /b 1
          if exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Draw on Screen.lnk" exit /b 1
      - name: Install, start and uninstall with the macOS launcher
        if: runner.os == 'macOS'
        run: |
          ./run-macos.command
          test -d "$HOME/Applications/Draw on Screen.app"
          cat "$HOME/Library/Application Support/io.github.hagdmk.drawonscreen/launcher-version.txt"
          ./run-macos.command --uninstall
          test ! -e "$HOME/Applications/Draw on Screen.app"
