name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Report binary size
        shell: bash
        run: ls -l src-tauri/target/release/draw-on-screen* | grep -v '\.d$'

  launchers:
    name: Launcher smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows launcher against the latest release
        if: runner.os == 'Windows'
        shell: cmd
        # Piped input answers the "pause" shown on failure, so a failure cannot hang the job.
        run: |
          echo.| call run-windows.bat
          if errorlevel 1 exit /b 1
          if not exist bin\windows\draw-on-screen.exe exit /b 1
          type bin\windows\version.txt
          taskkill /im draw-on-screen.exe /f
      - name: Run macOS launcher against the latest release
        if: runner.os == 'macOS'
        run: |
          ./run-macos.command
          test -d "bin/macos/Draw on Screen.app"
          cat bin/macos/version.txt
          osascript -e 'quit app "Draw on Screen"' || true
